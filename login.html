<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - BookStack</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/formularios.css">
</head>

<body class="body-login">
    <main class="login-main">

        <table class="login-header">
            <tr><td><h1>BookStack</h1></td></tr>
            <tr><td><p>SkillForge</p></td></tr>
            <tr>
                <td>
                    <div class="login-logo">
                        <img src="img/logo_vectorizado.svg" alt="Logo SkillForge">
                    </div>
                </td>
            </tr>
        </table>

        <form id="loginForm" class="login-formulario">
            <table class="tabla-login">
                <tr>
                    <td class="campo-login">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Value" required>
                    </td>
                </tr>
                <tr>
                    <td class="campo-login">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="Value" required>
                    </td>
                </tr>
                <tr>
                    <td class="mostrar-password">
                        <label>
                            <input type="checkbox" id="mostrarPassword">
                            <span>Mostrar contraseña</span>
                        </label>
                        <p>Descripción</p>
                    </td>
                </tr>
                <tr>
                    <td><button type="submit" class="btn-ingresar">Ingresar</button></td>
                </tr>
            </table>
        </form>

    </main>

    <script src="js/login.js"></script>
</body>
</html>
